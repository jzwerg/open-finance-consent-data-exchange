name: CI

# The proof is in CI: a green check means consent revocation and FAPI security
# actually hold. Steps are guarded by file existence so this runs cleanly now
# (planning phase) and becomes the real demo as the code in PLAN.md lands.

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Gateway + adapter tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install + test
        run: |
          if [ -f package.json ]; then
            npm ci || npm install
            npm test --if-present
          else
            echo "::notice::No Node project yet (PLAN.md). CI will run the test suite — canonical-model-to-adapter mapping for Berlin Group / OBIE / FDX and the FAPI 2.0 (PAR + DPoP) flow — once code lands."
          fi

  security-demo:
    name: Headline demo — replay vs revoked consent is rejected
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate the compose stack
        run: |
          if [ -f docker-compose.yml ]; then
            docker compose config -q && echo "docker-compose.yml is valid"
          else
            echo "::notice::docker-compose.yml not present yet (PLAN.md DoD). This job will boot the gateway + auth server + Postgres, grant then revoke a consent, assert a token replay against the revoked consent is rejected, and check the append-only audit log shows the trail."
          fi
